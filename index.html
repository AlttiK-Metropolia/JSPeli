<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BämskiLife</title>
    <script src="main.js" defer></script>
</head>
<body>
    <audio id="background-audio" loop>
        <source src="./audio/misonkaikkibamskit.mp3" type="audio/mpeg" />
    </audio>
    <div class="container">
        <h1>BämskiLife</h1>
        <div id="game-container">
            <p id="game-text">Tervetuloa BämskiLife-peliin! Klikkaa painiketta alkaaksesi matkasi.</p>
            <form id="start-form">
                <label for="name-input">Syötä Bämskisi nimi:</label>
                <input type="text" id="name-input" placeholder="Syötä nimesi" />
                <p id="name-error" class="error" hidden>Syötä nimi ennen kuin aloitat.</p>
                <button id="start-button" type="submit">Aloita peli</button>
            </form>
        </div>
        <div id="game-screen" hidden>
            <div id="profile-container">
                <p id="profile"></p>
                <p id="money"></p>
            </div>
            <div id="life-log"></div>
            <div id="event-box" hidden>
                <p id="event-text"></p>
                <div id="event-choices"></div>
            </div>
            <div id="button-container">
                <button id="relation-button">Suhteet</button>
                <button id="age-button"><div>+</div>Ikä</button>
                <button id="activities-button">Aktiviteetit</button>
            </div>
            <div id="activities-box" hidden>
                <p id="activities-text">Valitse aktiviteetti:</p>
                <div id="activities-choices"></div>
            </div>
            <div id="relation-box" hidden>
                <p id="relation-text">Valitse suhde:</p>
                <div id="relation-choices"></div>
            </div>
            <ul id="stats"></ul>
        </div>
    </div>
</body>
</html>
