<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BämskiLife</title>
    <script src="main.js" defer></script>
</head>
<body>
    <audio id="background-audio" loop>
        <source src="./audio/misonkaikkibamskit.mp3" type="audio/mpeg" />
    </audio>
    <div class="container">
        <h1>BämskiLife</h1>
        <div id="game-container">
            <p id="game-text">Welcome to BämskiLife! Click the button below to start your journey.</p>
            <form id="start-form">
                <label for="name-input">Enter your Bämski's name:</label>
                <input type="text" id="name-input" placeholder="Enter your name" />
                <button id="start-button" type="submit">Start Game</button>
            </form>
        </div>
    </div>
</body>
</html>
